<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AnimationFX spatial browser specimen</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #111; }
      body { width: 480px; height: 320px; overflow: hidden; }
      #replicator, #emitter { position: absolute; left: 24px; width: 432px; height: 120px; }
      #replicator { top: 24px; perspective: 400px; }
      #emitter { top: 176px; }
    </style>
  </head>
  <body>
    <div id="replicator"></div>
    <div id="emitter"></div>
  </body>
</html>
