<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Preferences title bar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 520px; height: 560px; box-sizing: border-box; padding: 36px 40px; display: flex; font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; background: radial-gradient(circle at 50% 40%, #6b7280, #2f343b);">
  <section role="dialog" aria-label="Appearance" style="flex-grow: 1; display: flex; flex-direction: column; border-radius: 14px; overflow: hidden; background: #eceef1; box-shadow: 0 24px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(0,0,0,0.35);">
    <div style="height: 64px; flex-shrink: 0; display: grid; grid-template-columns: 64px minmax(0, 1fr) 64px; align-items: center; padding: 0 8px; background: linear-gradient(#7c828a, #4f545b); border-bottom: 1px solid #33373c;">
      <button type="button" aria-label="Back to Preferences" style="width: 48px; height: 48px; border-radius: 12px; border: 1px solid #2c3035; background: linear-gradient(#6a7078, #3e4248); display: flex; align-items: center; justify-content: center;"><svg width="12" height="18" viewBox="0 0 12 18" fill="none" stroke="#f2f3f5" stroke-width="2.4" aria-hidden="true"><path d="M10 2L3 9l7 7"></path></svg></button>
      <h1 style="margin: 0; text-align: center; font-size: 20px; font-weight: 600; color: #f7f8f9; text-shadow: 0 -1px 0 rgba(0,0,0,0.55);">Appearance</h1>
      <span></span>
    </div>
    <div style="flex-grow: 1; display: flex; flex-direction: column;">
      <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid #cfd2d6; font-size: 15px; color: #2b2e33;">Dark appearance<span style="width: 52px; height: 26px; border-radius: 13px; background: linear-gradient(#5b97e6, #3570c8); box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);"></span></div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid #cfd2d6; font-size: 15px; color: #2b2e33;">Reduce transparency<span style="width: 52px; height: 26px; border-radius: 13px; background: linear-gradient(#c9ccd1, #a7abb2); box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);"></span></div>
      <div style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; border-bottom: 1px solid #cfd2d6; font-size: 15px; color: #2b2e33;">Accent colour<span style="font-size: 14px; color: #5a5f66;">Blue ›</span></div>
      <p style="margin: auto 18px 16px; font-size: 12.5px; color: #4a4f57;">Looks exactly as today. What changes is who draws the cap: it is the panel's title bar (toolbarStyle "preference"), so title = the pane's name, Back = a leading titlebar accessory, and Atmo paints the webOS plate.</p>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":520,"height":560}}'>
class Component extends DCLogic {
renderVals() { return {}; }
}
</script>
</body>
</html>
